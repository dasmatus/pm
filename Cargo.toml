[package]
name = "pm"
version = "0.1.0"
edition = "2024"
# build.rs compiles bundled plugins and test fixtures from plugins/, a separate workspace
# that `cargo package` would leave out of the crate, so a published pm could not build.
# pm ships as the binaries release.yml attaches to each tag.
publish = false

[[bench]]
name = "argv"
harness = false

[[bench]]
name = "entrypoints"
harness = false

[[bin]]
name = "pm-lsp"
path = "src/bin/pm-lsp.rs"

[[bin]]
name = "pm-trace"
path = "src/bin/pm-trace.rs"

[[bin]]
name = "pm-vm-init"
path = "src/bin/pm-vm-init.rs"

[[bin]]
name = "pmd"
path = "src/bin/pmd.rs"

[dependencies]
anyhow = "1"
arbitrary = { version = "1.4.2", features = ["derive"] }
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.12.0"
either = { version = "1.18.0", features = ["serde"] }
hakoniwa = { version = "1.8.0", features = ["landlock"] }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
miette = { version = "7.6.0", features = ["fancy"] }
minreq = { version = "3.0.0", features = ["https-rustls"] }
nix = { version = "0.31.3", features = ["fs", "mount", "process", "ptrace", "reboot", "signal", "term"] }
nom = "8.0.0"
rayon = "1.12.0"
rhai = { version = "1.26.1", features = ["grain", "internals", "metadata", "no_custom_syntax", "no_float", "no_time", "only_i64", "serde"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
starlark = "0.14.2"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = { version = "2.5.8", features = ["serde"] }
walkdir = "2.5.0"
wasmtime = { version = "49.0.0", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api", "p2p"] }

[build-dependencies]
# Encodes the bundled plugins built by build.rs as components.
wit-component = "0.258.0"

[dev-dependencies]
divan = "0.1.21"
proptest = "1.11.0"

# pm compiles its bundled WebAssembly plugins with Cranelift on first use. Unoptimised,
# that takes ~30s and every test that classifies a command pays it; optimised it is ~2s.
# Only the compiler is optimised, so pm's own code stays as debuggable as before.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.gimli]
opt-level = 3
