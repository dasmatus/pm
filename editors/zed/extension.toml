id = "pm"
name = "PM"
description = "PM recipe support: Rhai .rhai recipes, and deprecated Starlark .package files."
version = "0.1.0"
schema_version = 1
authors = ["dasmatus"]

[grammars.rhai]
repository = "https://github.com/elkowar/tree-sitter-rhai"
commit = "4ac7384d487ffcb54e746ef1569585a749370c5b"

# Deprecated Starlark recipes, kept until pm stops loading them.
[grammars.starlark]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-starlark"
commit = "a453dbf3ba433db0e5ec621a38a7e59d72e4dc69"

[language_servers.pm-lsp]
name = "pm-lsp"
languages = ["PM Recipe", "PM Package"]
